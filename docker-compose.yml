services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  chatbot:
    build: .
    container_name: llm-chatbot
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      EMBED_MODEL: nomic-embed-text
    ports:
      - "8000:8000"

volumes:
  ollama_data: